<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Topic Radar — AI Topic Digest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="h-screen flex overflow-hidden">

  <!-- Left Sidebar: Subscribed Topics, Starter Packs, Backup/Restore -->
  <aside class="w-80 bg-slate-900/90 border-r border-slate-800 flex flex-col h-full shrink-0">
    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-bold text-white shadow">📡</span>
        <div>
          <h1 class="font-bold text-slate-100 text-base leading-tight">YT Topic Radar</h1>
          <p class="text-xs text-slate-400">Signal over clickbait</p>
        </div>
      </div>
      <button id="btnSettingsToggle" title="API Key & Settings" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 text-sm">⚙️</button>
    </div>

    <!-- Settings Drawer (API Key) -->
    <div id="settingsPanel" class="hidden p-3.5 bg-slate-950/90 border-b border-slate-800 space-y-2.5 text-xs">
      <div class="flex items-center justify-between">
        <span class="font-semibold text-slate-300">Gemini API Key (BYOK)</span>
        <span id="keyStatusBadge" class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">Configured</span>
      </div>
      <div class="flex gap-1.5">
        <input id="apiKeyInput" type="password" placeholder="Paste Gemini API Key..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-red-500" />
        <button id="btnSaveKey" class="bg-red-600 hover:bg-red-500 text-white font-medium px-3 py-1.5 rounded">Save</button>
      </div>
    </div>

    <!-- Custom Topic Input -->
    <div class="p-3.5 border-b border-slate-800">
      <form id="addTopicForm" class="flex gap-1.5">
        <input id="newTopicInput" type="text" placeholder="+ Add any topic (e.g. Rust Async)..." class="flex-1 bg-slate-950 border border-slate-700/80 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500" />
        <button type="submit" class="bg-red-600 hover:bg-red-500 text-white font-medium px-3.5 py-2 rounded-lg text-sm transition">Add</button>
      </form>
    </div>

    <!-- Subscribed Topics List -->
    <div class="flex-1 overflow-y-auto p-3 space-y-5">
      <div>
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-2 mb-2 flex items-center justify-between">
          <span>Your Subscribed Topics</span>
          <span id="topicCountBadge" class="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded">0</span>
        </div>
        <div id="topicsList" class="space-y-1"></div>
      </div>

      <!-- Pinned Channels Section -->
      <div id="pinnedChannelsSection" class="hidden">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-2 mb-2">📌 Pinned Channels (RSS)</div>
        <div id="pinnedChannelsList" class="space-y-1 text-xs"></div>
      </div>

      <!-- Starter Topic Pills (Onboarding / Discovery) -->
      <div>
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-2 mb-2">Starter Topic Packs</div>
        <div id="starterPacksContainer" class="space-y-3 px-1"></div>
      </div>
    </div>

    <!-- 1-Click Backup & Restore Footer -->
    <div class="p-3 border-t border-slate-800 bg-slate-950/60 space-y-2">
      <div class="text-[11px] text-slate-400 font-medium px-1">Local Storage Safeguard</div>
      <div class="grid grid-cols-2 gap-2">
        <button id="btnExportBackup" class="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium py-2 px-2.5 rounded-lg border border-slate-700 transition">
          ⬇️ Export .json
        </button>
        <label class="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium py-2 px-2.5 rounded-lg border border-slate-700 cursor-pointer transition">
          ⬆️ Import .json
          <input id="inputImportBackup" type="file" accept=".json,application/json" class="hidden" />
        </label>
      </div>
      <div id="statusToast" class="hidden text-xs text-emerald-400 px-1 pt-0.5 truncate"></div>
    </div>
  </aside>

  <!-- Main Content Area: Topic Synthesis & Video Digest Cards -->
  <main class="flex-1 flex flex-col h-full overflow-hidden">
    <!-- Top Header -->
    <header class="h-16 border-b border-slate-800 bg-slate-900/50 px-6 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <h2 id="activeTopicTitle" class="text-xl font-bold text-white">Select a Topic</h2>
        <span id="lastScannedBadge" class="text-xs text-slate-400"></span>
      </div>
      <div class="flex items-center gap-2.5">
        <select id="scanCountSelect" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2.5 py-2">
          <option value="2">Top 2 Videos</option>
          <option value="3" selected>Top 3 Videos</option>
          <option value="5">Top 5 Videos</option>
        </select>
        <button id="btnScanTopic" class="bg-red-600 hover:bg-red-500 disabled:opacity-50 text-white font-semibold px-4 py-2 rounded-lg text-sm flex items-center gap-2 shadow transition">
          <span id="scanBtnIcon">🔍</span>
          <span id="scanBtnText">Scan Topic Now</span>
        </button>
      </div>
    </header>

    <!-- Scrollable Digest Feed -->
    <div id="digestContainer" class="flex-1 overflow-y-auto p-6 space-y-6 max-w-5xl"></div>
  </main>

  <!-- Right Side-Panel Video Player + Docked Reader (Opens when clicking a [MM:SS] timestamp) -->
  <aside id="videoSidePanel" class="hidden w-[480px] bg-slate-900 border-l border-slate-800 flex flex-col h-full shrink-0">
    <div class="p-3.5 border-b border-slate-800 flex items-center justify-between">
      <span id="sidePanelTitle" class="font-semibold text-sm text-slate-200 truncate pr-2">Video Player</span>
      <button id="btnCloseSidePanel" class="text-slate-400 hover:text-white px-2 py-1 rounded bg-slate-800 text-xs">✕ Close</button>
    </div>
    <div class="aspect-video bg-black w-full shrink-0">
      <iframe id="ytPlayerIframe" class="w-full h-full" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    <div id="sidePanelNotes" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm"></div>
  </aside>

  <script type="module">
    let state = {
      sync: { topics: [], pinnedChannels: [], minDurationSec: 180 },
      digests: {},
      starterTopics: {},
      hasApiKey: false,
      maskedKey: "",
    };
    let activeTopic = "";
    let isScanning = false;

    const el = (id) => document.getElementById(id);

    function showToast(msg, isError = false) {
      const t = el("statusToast");
      t.textContent = msg;
      t.className = `text-xs px-1 pt-0.5 truncate ${isError ? "text-rose-400" : "text-emerald-400"}`;
      t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), 5000);
    }

    function parseTimestampToSec(ts) {
      const clean = String(ts || "").replace(/[\[\]]/g, "").trim();
      const parts = clean.split(":").map((n) => parseInt(n, 10) || 0);
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      return parts[0] || 0;
    }

    async function loadState() {
      const res = await fetch("/api/state");
      state = await res.json();
      if (!activeTopic && state.sync.topics.length > 0) {
        activeTopic = state.sync.topics[0];
      }
      renderAll();
    }

    async function saveSync(nextSync) {
      state.sync = nextSync;
      await fetch("/api/sync", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(nextSync),
      });
      renderAll();
    }

    function renderAll() {
      // Key status
      const badge = el("keyStatusBadge");
      badge.textContent = state.hasApiKey ? `Key: ${state.maskedKey}` : "No API Key";
      badge.className = state.hasApiKey
        ? "px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300"
        : "px-2 py-0.5 rounded bg-amber-500/20 text-amber-300";

      // Topics list
      el("topicCountBadge").textContent = String(state.sync.topics.length);
      const list = el("topicsList");
      list.innerHTML = "";
      for (const t of state.sync.topics) {
        const isActive = t === activeTopic;
        const hasDigest = Boolean(state.digests[t]?.videos?.length);
        const row = document.createElement("div");
        row.className = `group flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer text-sm transition ${
          isActive
            ? "bg-red-600/20 text-white font-semibold border border-red-500/40"
            : "text-slate-300 hover:bg-slate-800/70"
        }`;
        row.innerHTML = `
          <div class="flex items-center gap-2 truncate flex-1">
            <span class="w-2 h-2 rounded-full ${hasDigest ? "bg-emerald-400" : "bg-slate-600"}"></span>
            <span class="truncate">${t}</span>
          </div>
          <button data-remove="${t}" title="Remove topic" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-400 px-1.5 text-xs">✕</button>
        `;
        row.addEventListener("click", (e) => {
          const rm = e.target.getAttribute("data-remove");
          if (rm) {
            e.stopPropagation();
            const nextTopics = state.sync.topics.filter((x) => x !== rm);
            if (activeTopic === rm) activeTopic = nextTopics[0] || "";
            saveSync({ ...state.sync, topics: nextTopics });
            return;
          }
          activeTopic = t;
          renderAll();
        });
        list.appendChild(row);
      }

      // Pinned channels
      const pinnedSec = el("pinnedChannelsSection");
      const pinnedList = el("pinnedChannelsList");
      if (state.sync.pinnedChannels.length > 0) {
        pinnedSec.classList.remove("hidden");
        pinnedList.innerHTML = state.sync.pinnedChannels
          .map(
            (c) => `
          <div class="flex items-center justify-between px-2.5 py-1.5 rounded bg-slate-800/60 text-slate-300">
            <span class="truncate">📌 ${c.channelName} <span class="text-slate-500">(${c.topic})</span></span>
            <button data-unpin="${c.channelId}" class="text-slate-400 hover:text-rose-400 ml-2">✕</button>
          </div>`
          )
          .join("");
        pinnedList.querySelectorAll("[data-unpin]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-unpin");
            saveSync({
              ...state.sync,
              pinnedChannels: state.sync.pinnedChannels.filter((x) => x.channelId !== id),
            });
          });
        });
      } else {
        pinnedSec.classList.add("hidden");
      }

      // Starter Packs
      const packs = el("starterPacksContainer");
      packs.innerHTML = "";
      for (const [cat, items] of Object.entries(state.starterTopics)) {
        const block = document.createElement("div");
        block.innerHTML = `<div class="text-[11px] text-slate-400 mb-1.5 font-medium">${cat}</div>`;
        const pills = document.createElement("div");
        pills.className = "flex flex-wrap gap-1.5";
        for (const item of items) {
          const subscribed = state.sync.topics.includes(item);
          const btn = document.createElement("button");
          btn.className = `text-xs px-2.5 py-1 rounded-full border transition ${
            subscribed
              ? "bg-emerald-500/15 border-emerald-500/40 text-emerald-300"
              : "bg-slate-800/80 border-slate-700 text-slate-300 hover:border-slate-500"
          }`;
          btn.textContent = subscribed ? `✓ ${item}` : `+ ${item}`;
          btn.addEventListener("click", () => {
            if (!subscribed) {
              activeTopic = item;
              saveSync({ ...state.sync, topics: [...state.sync.topics, item] });
            } else {
              activeTopic = item;
              renderAll();
            }
          });
          pills.appendChild(btn);
        }
        block.appendChild(pills);
        packs.appendChild(block);
      }

      renderMainDigest();
    }

    function renderMainDigest() {
      el("activeTopicTitle").textContent = activeTopic || "Select or add a topic";
      const digest = state.digests[activeTopic];
      const container = el("digestContainer");

      if (isScanning) {
        el("lastScannedBadge").textContent = "Scanning YouTube & extracting insights...";
        container.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center space-y-3 animate-pulse">
            <div class="text-3xl">🛰️</div>
            <div class="text-lg font-semibold text-white">Scanning YouTube for "${activeTopic}"...</div>
            <p class="text-sm text-slate-400 max-w-md mx-auto">
              Searching recent uploads → Filtering out clickbait & shorts → Extracting timed transcripts → Running structured Gemini breakdown...
            </p>
          </div>
        `;
        return;
      }

      if (!digest || !digest.videos || digest.videos.length === 0) {
        el("lastScannedBadge").textContent = "Not scanned yet";
        container.innerHTML = `
          <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-10 text-center space-y-3">
            <div class="text-3xl">🔭</div>
            <div class="text-lg font-semibold text-slate-200">No digest generated for "${activeTopic}" yet</div>
            <p class="text-sm text-slate-400 max-w-md mx-auto">
              Click <b>Scan Topic Now</b> in the top-right to discover the highest-signal YouTube videos and extract their complete timestamped breakdown.
            </p>
          </div>
        `;
        return;
      }

      const dateStr = new Date(digest.generatedAt).toLocaleString();
      el("lastScannedBadge").textContent = `Updated ${dateStr}`;

      const subtopicsHtml = (digest.suggestedSubtopics || [])
        .map(
          (st) =>
            `<button data-subtopic="${st}" class="text-xs bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-500/30 px-2.5 py-1 rounded-full transition">+ Track "${st}"</button>`
        )
        .join("");

      const videosHtml = digest.videos
        .map((v, idx) => {
          const verdictColor =
            v.worthWatchingFull === "Yes"
              ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/30"
              : v.worthWatchingFull === "Skim timestamps"
              ? "bg-amber-500/20 text-amber-300 border-amber-500/30"
              : "bg-slate-700/50 text-slate-300 border-slate-600";

          const chaptersHtml = (v.chapterBreakdown || [])
            .map(
              (c) => `
              <div class="border-l-2 border-slate-700 pl-3 py-1 space-y-1">
                <div class="flex items-center gap-2">
                  <button data-vid="${v.videoId}" data-vtitle="${encodeURIComponent(v.title)}" data-ts="${c.timestamp}" class="font-mono text-xs bg-red-500/20 hover:bg-red-500/30 text-red-300 px-2 py-0.5 rounded border border-red-500/30 transition">
                    ▶ [${c.timestamp}]
                  </button>
                  <span class="font-semibold text-slate-200 text-sm">${c.sectionTitle}</span>
                </div>
                <ul class="list-disc list-inside text-slate-300 text-sm space-y-0.5 pl-1">
                  ${(c.keyPoints || []).map((kp) => `<li>${kp}</li>`).join("")}
                </ul>
              </div>`
            )
            .join("");

          const detailsHtml = (v.typeSpecificDetails || [])
            .map(
              (d) => `
              <div class="bg-slate-950/70 border border-slate-800/80 rounded-lg p-3">
                <div class="text-xs font-bold uppercase tracking-wider text-indigo-400 mb-1.5">${d.label}</div>
                <ul class="list-disc list-inside text-xs text-slate-300 space-y-1">
                  ${(d.items || []).map((item) => `<li>${item}</li>`).join("")}
                </ul>
              </div>`
            )
            .join("");

          return `
            <article class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4 shadow">
              <div class="flex items-start justify-between gap-4">
                <div class="space-y-1">
                  <div class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-semibold uppercase">${v.videoType.replace("_", " ")}</span>
                    <span class="px-2 py-0.5 rounded border ${verdictColor} font-medium">Verdict: ${v.worthWatchingFull}</span>
                    <span class="text-slate-400">Signal ${v.signalScore}/100 • ${v.durationText}</span>
                  </div>
                  <h3 class="text-lg font-bold text-white leading-snug">
                    <a href="${v.url}" target="_blank" class="hover:text-red-400 transition">${idx + 1}. ${v.title}</a>
                  </h3>
                  <div class="text-xs text-slate-400">Channel: <span class="text-slate-200 font-medium">${v.channelName}</span></div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <button data-tts="${idx}" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition">🔊 Read Aloud</button>
                  <button data-pin-id="${v.channelId}" data-pin-name="${v.channelName}" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition">📌 Pin Channel</button>
                </div>
              </div>

              <!-- Core Thesis Box -->
              <div class="bg-slate-950 border border-slate-800 rounded-lg p-3.5 text-sm text-slate-200 leading-relaxed">
                <span class="font-bold text-red-400 uppercase text-xs mr-1.5">Core Takeaway:</span>
                ${v.coreThesis}
                <div class="text-xs text-slate-400 mt-1 italic">Why watch/skip: ${v.worthWatchingReason}</div>
              </div>

              <!-- Type-Specific Extracted Details -->
              ${detailsHtml ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${detailsHtml}</div>` : ""}

              <!-- Complete Chronological Chapter Breakdown -->
              <details open class="group">
                <summary class="cursor-pointer text-xs font-semibold uppercase tracking-wider text-slate-400 hover:text-slate-200 select-none">
                  Chronological Section Breakdown (${(v.chapterBreakdown || []).length} sections — click any timestamp to jump)
                </summary>
                <div class="mt-3 space-y-3">
                  ${chaptersHtml}
                </div>
              </details>
            </article>
          `;
        })
        .join("");

      container.innerHTML = `
        <!-- Top Synthesis Card -->
        <section class="bg-gradient-to-br from-indigo-950/60 via-slate-900 to-slate-900 border border-indigo-500/30 rounded-xl p-5 space-y-3 shadow-lg">
          <div class="flex items-center justify-between">
            <div class="text-xs font-bold uppercase tracking-wider text-indigo-300 flex items-center gap-1.5">
              <span>🌐 Cross-Video Topic Synthesis</span>
              <span class="text-slate-400 font-normal">(${digest.videos.length} videos analyzed)</span>
            </div>
            <button id="btnReadSynthesis" class="text-xs bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-200 px-2.5 py-1 rounded border border-indigo-500/30">🔊 Read Synthesis</button>
          </div>
          <p class="text-sm text-slate-200 leading-relaxed">${digest.crossVideoSynthesis}</p>
          ${
            subtopicsHtml
              ? `<div class="pt-2 border-t border-slate-800/80 flex flex-wrap items-center gap-2">
                   <span class="text-xs text-slate-400">AI Suggested Sub-topics:</span>
                   ${subtopicsHtml}
                 </div>`
              : ""
          }
        </section>

        <!-- Video Digest Cards -->
        <section class="space-y-5">
          ${videosHtml}
        </section>
      `;

      // Bind subtopic pills
      container.querySelectorAll("[data-subtopic]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const st = btn.getAttribute("data-subtopic");
          if (st && !state.sync.topics.includes(st)) {
            activeTopic = st;
            saveSync({ ...state.sync, topics: [...state.sync.topics, st] });
            showToast(`Added "${st}" to your topics`);
          }
        });
      });

      // Bind timestamp buttons -> open Side Panel Player at exact second
      container.querySelectorAll("[data-ts]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const vid = btn.getAttribute("data-vid");
          const vtitle = decodeURIComponent(btn.getAttribute("data-vtitle") || "");
          const ts = btn.getAttribute("data-ts");
          const sec = parseTimestampToSec(ts);
          const videoObj = digest.videos.find((x) => x.videoId === vid);
          openSidePanelPlayer(vid, vtitle, sec, videoObj);
        });
      });

      // Bind Read Aloud (TTS)
      const synthBtn = el("btnReadSynthesis");
      if (synthBtn) {
        synthBtn.addEventListener("click", () => speakText(digest.crossVideoSynthesis));
      }
      container.querySelectorAll("[data-tts]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-tts"));
          const v = digest.videos[idx];
          if (!v) return;
          const script = `${v.title} by ${v.channelName}. Core takeaway: ${v.coreThesis}. ${v.chapterBreakdown
            .map((c) => `At ${c.timestamp}, ${c.sectionTitle}: ${c.keyPoints.join(". ")}`)
            .join(". ")}`;
          speakText(script);
        });
      });

      // Bind Pin Channel
      container.querySelectorAll("[data-pin-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const channelId = btn.getAttribute("data-pin-id") || "";
          const channelName = btn.getAttribute("data-pin-name") || "Channel";
          if (!channelId) return;
          const exists = state.sync.pinnedChannels.some((c) => c.channelId === channelId);
          if (!exists) {
            saveSync({
              ...state.sync,
              pinnedChannels: [
                ...state.sync.pinnedChannels,
                { channelId, channelName, topic: activeTopic },
              ],
            });
            showToast(`Pinned ${channelName} to RSS monitor`);
          }
        });
      });
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) {
        showToast("Speech synthesis not supported in this browser", true);
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.05;
      window.speechSynthesis.speak(utter);
      showToast("🔊 Reading aloud... (click again to restart)");
    }

    function openSidePanelPlayer(videoId, title, startSec, videoObj) {
      const panel = el("videoSidePanel");
      panel.classList.remove("hidden");
      el("sidePanelTitle").textContent = title;
      el("ytPlayerIframe").src = `https://www.youtube.com/embed/${videoId}?start=${startSec}&autoplay=1`;

      const notes = el("sidePanelNotes");
      if (videoObj) {
        notes.innerHTML = `
          <div class="text-xs font-semibold uppercase text-red-400">Docked Summary Notes</div>
          <p class="text-xs text-slate-300">${videoObj.coreThesis}</p>
          <div class="space-y-2 pt-2">
            ${(videoObj.chapterBreakdown || [])
              .map(
                (c) => `
              <div class="p-2 rounded bg-slate-950 border border-slate-800">
                <button data-jump="${parseTimestampToSec(c.timestamp)}" class="font-mono text-xs text-red-400 hover:underline">[${c.timestamp}] ${c.sectionTitle}</button>
                <ul class="list-disc list-inside text-xs text-slate-300 mt-1 space-y-0.5">
                  ${c.keyPoints.map((k) => `<li>${k}</li>`).join("")}
                </ul>
              </div>`
              )
              .join("")}
          </div>
        `;
        notes.querySelectorAll("[data-jump]").forEach((b) => {
          b.addEventListener("click", () => {
            const s = b.getAttribute("data-jump");
            el("ytPlayerIframe").src = `https://www.youtube.com/embed/${videoId}?start=${s}&autoplay=1`;
          });
        });
      }
    }

    // Event Listeners
    el("btnCloseSidePanel").addEventListener("click", () => {
      el("ytPlayerIframe").src = "";
      el("videoSidePanel").classList.add("hidden");
    });

    el("btnSettingsToggle").addEventListener("click", () => {
      el("settingsPanel").classList.toggle("hidden");
    });

    el("btnSaveKey").addEventListener("click", async () => {
      const key = el("apiKeyInput").value.trim();
      if (!key) return;
      await fetch("/api/key", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ apiKey: key }),
      });
      el("apiKeyInput").value = "";
      showToast("Saved Gemini API key");
      await loadState();
    });

    el("addTopicForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const val = el("newTopicInput").value.trim();
      if (!val) return;
      el("newTopicInput").value = "";
      activeTopic = val;
      if (!state.sync.topics.includes(val)) {
        saveSync({ ...state.sync, topics: [val, ...state.sync.topics] });
      } else {
        renderAll();
      }
    });

    el("btnScanTopic").addEventListener("click", async () => {
      if (!activeTopic || isScanning) return;
      isScanning = true;
      el("btnScanTopic").disabled = true;
      el("scanBtnText").textContent = "Scanning...";
      renderMainDigest();

      try {
        const maxVideos = Number(el("scanCountSelect").value || 3);
        const res = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic: activeTopic, maxVideos }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Scan failed");
        state.digests[activeTopic] = data.digest;
        showToast(`Summarized ${data.digest.videos.length} videos for "${activeTopic}"`);
      } catch (err) {
        showToast(err.message || "Scan failed", true);
      } finally {
        isScanning = false;
        el("btnScanTopic").disabled = false;
        el("scanBtnText").textContent = "Scan Topic Now";
        renderMainDigest();
      }
    });

    // 1-Click Export Backup
    el("btnExportBackup").addEventListener("click", () => {
      window.location.href = "/api/backup/export";
      showToast("Exported backup .json");
    });

    // 1-Click Import Backup
    el("inputImportBackup").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        const res = await fetch("/api/backup/import", {
          method: "POST",
          body: text,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Import failed");
        showToast(`Restored ${data.topicsCount} topics & ${data.digestsCount} digests`);
        await loadState();
      } catch (err) {
        showToast(err.message || "Invalid backup file", true);
      } finally {
        e.target.value = "";
      }
    });

    loadState();
  </script>
</body>
</html>
